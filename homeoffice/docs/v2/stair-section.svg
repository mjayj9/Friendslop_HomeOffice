<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#f4f0e8"/><g font-family="Malgun Gothic,Arial" fill="#203d34"><text x="45" y="48" font-size="25">모여집 · U자 계단 단면 / 설계 치수</text><text x="45" y="79" font-size="15">두 층 바닥 연결, 실제 보행 충돌은 완만한 볼록 경사체. 도식은 폭 방향을 펼쳐 표시.</text><g stroke="#6f4f30" stroke-width="8" fill="none"><path d="M 65 435 H 125 V 422 H 152 V 409 H 179 V 396 H 206 V 383 H 233 V 370 H 260 V 357 H 287 V 344 H 314 V 331 H 341 V 318 H 368 V 305 H 395 H 485 V 292 H 512 V 279 H 539 V 266 H 566 V 253 H 593 V 240 H 620 V 227 H 647 V 214 H 674 V 201 H 701 V 188 H 728 V 175 H 755 H 930"/></g><g stroke="#80968c" stroke-width="2" stroke-dasharray="6 5"><path d="M 55 435 H 935 M 55 175 H 935 M 420 305 H 480"/></g><text x="70" y="469" font-size="18">1층 +0.00m</text><text x="775" y="157" font-size="18">2층 +3.60m</text><text x="358" y="337" font-size="17">계단참 +1.80m</text><text x="70" y="508" font-size="17">20단 × 0.18m / 디딤판 0.30m / 각 경로 폭 1.50m / 중앙 계단참 깊이 1.50m</text><text x="70" y="536" font-size="14">단면 제안값이며 건축 법규 검토/시공 도면이 아닙니다. 실제 게임의 머리 간섭·발 디딤은 별도 보행 증거를 따릅니다.</text></g></svg>