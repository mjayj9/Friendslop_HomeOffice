name: Verify published HomeOffice export
on:
  push:
    branches: [main, codex/homeoffice-v3]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication regressions
        run: python homeoffice/tests/site-artifact.test.py
      - name: Verify deployed bytes and matching source
        run: python homeoffice/tools/site_artifact.py verify docs --source
